<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMochi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        // 偏好的快取（以伺服器 settings.local.json 為準，見 src/theme.ts）；跟隨系統時依系統設定
        var t = localStorage.getItem("themePref") || localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-P6L_dYMN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-mACg68qc.css">
  </head>
  <body>
    <!-- Gallery 貼紙的白色模切邊＋投影（index.css 的 .sticker-img 用）。
         一個 SVG 濾鏡一次做完：把透明度外擴 2px 塗白當邊，再從外擴後的形狀做模糊投影。
         外觀等同原本 5 層 CSS drop-shadow（4 個 2px 位移＝邊長 2px 的方形外擴），但每次只算一遍，捲動時快很多 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="sticker-outline" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="edge" />
        <feGaussianBlur in="edge" stdDeviation="3" />
        <feOffset dy="5" result="blur" />
        <feFlood flood-color="rgb(52,49,90)" flood-opacity="0.22" />
        <feComposite in2="blur" operator="in" result="shadow" />
        <feFlood flood-color="#fff" />
        <feComposite in2="edge" operator="in" result="white" />
        <feMerge><feMergeNode in="shadow" /><feMergeNode in="white" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </svg>
    <div id="root"></div>
  </body>
</html>
