# 推 v* tag（例如 v0.2.0）時：測試 → 前端 build → PyInstaller 打包後端 → electron-builder 打包並發到這個 repo 的 Releases
# 已安裝的 EMochi 會從 Releases 的 latest.yml 檢查、下載更新（desktop/updater.js）；repo 要是公開的，App 才下載得到
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 建立 Release、上傳安裝檔（內建的 GITHUB_TOKEN）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 tag 和 desktop/package.json 的版本一致
        shell: pwsh
        run: |
          $pkg = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { Write-Error "tag v$tag 和 desktop/package.json 的 $pkg 不一致（用 scripts\release.bat 改版號）"; exit 1 }

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: 後端測試
        run: |
          uv sync --group desktop
          uv run pytest -q

      - name: 前端 build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包後端（PyInstaller）
        run: uv run --group desktop pyinstaller desktop/emochi-server.spec --noconfirm --distpath dist --workpath build

      - name: 打包並發布（electron-builder → Releases）
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --publish always

      - name: 保留一份打包產物（除錯用，7 天）
        uses: actions/upload-artifact@v4
        with:
          name: EMochi-${{ github.ref_name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          retention-days: 7
