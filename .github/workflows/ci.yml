# 推到 main／develop、開 PR 時：lint／格式檢查、後端測試、前端型別檢查與 build（不打包、不發版）
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0   # 這個 action 沒有 v10 這種大版本標籤，要寫完整版本
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 後端 lint／格式
        run: |
          uv sync
          uv run ruff check
          uv run ruff format --check

      - name: 後端測試
        run: uv run pytest -q

      - name: 前端 lint／格式／測試＋build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build
