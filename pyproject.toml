[project]
name = "emochi"
version = "0.1.0"
description = "AI 生成 Twitch / Discord 貼圖：Codex $imagegen 生成網格 → 切割去背 → 多尺寸輸出"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "ASSETS-LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.143.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["archive", "outputs", "exports", "logs"]

[tool.ruff.lint]
# E/W：pycodestyle、F：pyflakes、I：import 排序、B：bugbear、UP：新語法
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]   # 行長交給 formatter；中文註解、長字串折不了的就讓它長

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
desktop = ["pyinstaller>=6.11"]   # 桌面版打包後端（desktop/emochi-server.spec）
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
